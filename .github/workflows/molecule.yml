---

name: Molecule
on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
    paths-ignore:
      - '**/*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python 3.
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.14'

      # Same hooks and pinned versions as local pre-commit (yamllint, ansible-lint, gitleaks).
      - name: Install test dependencies.
        run: pip3 install pre-commit

      - name: Lint code.
        run: pre-commit run --all-files --show-diff-on-failure

  molecule:
    name: Molecule
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - almalinux8
          - almalinux9
          - almalinux10
          - debian12
          - debian13
          - fedora42
          - fedora43
          - fedora44
          - rockylinux8
          - rockylinux9
          - rockylinux10
          - ubuntu2204
          - ubuntu2404
        include:
          # EL8 legs ship a managed-node Python below ansible-core 2.17's
          # floor (module_utils/_internal uses positional-only params,
          # Python 3.8+): almalinux8/rockylinux8 have 3.6.8. Pin them to
          # ansible-core 2.16.x, and pin the controller to Python 3.12
          # (ansible-compat refuses ansible-core < 2.20 on controller
          # Python >= 3.14). Every other distro uses latest ansible for
          # dnf5/libdnf5 support (e.g. Fedora 41+).
          - distro: almalinux8
            ansible_pin: "ansible<10"
            python_version: '3.12'
          - distro: rockylinux8
            ansible_pin: "ansible<10"
            python_version: '3.12'

    steps:
      - name: Check out the codebase.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python 3.
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: ${{ matrix.python_version || '3.12' }}

      - name: Install test dependencies.
        run: pip3 install "${{ matrix.ansible_pin || 'ansible' }}" molecule "molecule-plugins[podman]"

      - name: Run Molecule tests.
        run: molecule test
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          MOLECULE_DISTRO: ${{ matrix.distro }}

  release:
    name: Release
    runs-on: ubuntu-latest
    environment: galaxy
    needs:
      - lint
      - molecule
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout git repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          submodules: true
          fetch-depth: 0

      # The ansible-galaxy-action container runs Python 3.15, which breaks ansible-core.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.14"

      - run: pip install ansible-core

      - name: Release on galaxy
        run: >-
          ansible-galaxy role import --api-key "$GALAXY_API_KEY"
          --branch main
          "${GITHUB_REPOSITORY%/*}" "${GITHUB_REPOSITORY#*/}"
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
