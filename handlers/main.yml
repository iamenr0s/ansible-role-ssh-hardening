---
# SSH Hardening Role - Handlers
# These handlers manage SSH service state changes

- name: Restart ssh
  listen: "restart ssh"
  tags:
    - ssh
    - service
  ansible.builtin.service:
    name: "{{ ssh_service_name }}"
    state: restarted

- name: Reload ssh
  listen: "reload ssh"
  tags:
    - ssh
    - service
  ansible.builtin.service:
    name: "{{ ssh_service_name }}"
    state: reloaded

- name: Validate ssh config
  listen: "validate ssh config"
  tags:
    - ssh
    - validation
  ansible.builtin.command: sshd -t
  changed_when: false

- name: Validate SSH configuration before restart
  listen: "restart ssh with validation"
  tags:
    - ssh
    - validation
  ansible.builtin.command: sshd -t
  changed_when: false

- name: Restart ssh (validated)
  listen: "restart ssh with validation"
  tags:
    - ssh
    - service
    - validation
  ansible.builtin.service:
    name: "{{ ssh_service_name }}"
    state: restarted
